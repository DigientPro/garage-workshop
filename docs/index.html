<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <title>Проект мастерской · 3D-план</title>
  <link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
  <main class="viewer">
    <header>
      <h1>Проект мастерской</h1>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="layer-menu">Слои модели</button>
      <div class="layer-menu" id="layer-menu" hidden>
        <fieldset disabled id="layer-controls" aria-label="Слои модели">
          <div class="toolbar" role="group" aria-label="Видимость пола и потолка">
            <button type="button" class="layer-toggle" id="floor" aria-pressed="true"><span class="layer-indicator" aria-hidden="true">✓</span>Пол</button>
            <button type="button" class="layer-toggle" id="ceiling" aria-pressed="true"><span class="layer-indicator" aria-hidden="true">✓</span>Потолок</button>
          </div>
          <div class="toolbar" role="group" aria-label="Слои пола">
            <button type="button" class="layer-toggle" id="deck" aria-pressed="false"><span class="layer-indicator" aria-hidden="true">✓</span>Настил ОСБ</button>
            <button type="button" class="layer-toggle" id="joists" aria-pressed="true"><span class="layer-indicator" aria-hidden="true">✓</span>Лаги и люк</button>
          </div>
        </fieldset>
      </div>
    </header>
    <section class="stage" id="stage" aria-label="Модель гаража">
      <canvas tabindex="0" aria-label="3D-модель гаража. Перетаскивайте для поворота, масштабируйте колесом или двумя пальцами."></canvas>
      <p id="status" role="status">Загрузка модели…</p>
    </section>
    <div class="view-bar">
      <fieldset class="toolbar" disabled id="view-controls" aria-label="Ракурс">
        <button type="button" id="overview">Общий вид</button>
        <button type="button" id="above">Сверху</button>
        <button type="button" id="below">На потолок</button>
      </fieldset>
    </div>
  </main>
  <script type="module" src="./viewer.js?v=6"></script>
</body>
</html>
