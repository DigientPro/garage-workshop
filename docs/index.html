<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <title>Мастерская · 3D-план</title>
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <main class="viewer">
    <header><h1>Мастерская</h1></header>
    <section class="stage" id="stage" aria-label="Модель гаража">
      <canvas tabindex="0" aria-label="3D-модель гаража. Перетаскивайте для поворота, масштабируйте колесом или двумя пальцами."></canvas>
      <p id="status" role="status">Загрузка модели…</p>
    </section>
    <div class="controls">
      <fieldset disabled id="controls">
        <div class="toolbar" role="group" aria-label="Ракурс">
          <button type="button" id="overview">Общий вид</button>
          <button type="button" id="above">Сверху</button>
          <button type="button" id="below">На потолок</button>
        </div>
        <div class="toolbar floor-options" role="group" aria-label="Вариант пола">
          <button type="button" id="deck" aria-pressed="true">Настил ОСБ</button>
          <button type="button" id="joists" aria-pressed="false">Лаги и люк</button>
        </div>
        <div class="toolbar layers" role="group" aria-label="Видимость пола и потолка">
          <button type="button" id="floor" aria-controls="stage">Скрыть пол</button>
          <button type="button" id="ceiling" aria-controls="stage">Показать потолок</button>
        </div>
      </fieldset>
    </div>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
